# Render Blueprint Configuration
# Documentation: https://render.com/docs/blueprint-spec

databases:
  - name: malkincraft-db
    plan: free
    region: ohio

services:
  # 1. The Node.js Express Backend
  - type: web
    name: malkincraft-backend
    env: node
    plan: free
    region: ohio
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: malkincraft-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        # We will populate this automatically with the frontend's URL later.
        value: ""

  # 2. The Vite React Frontend
  - type: web
    name: malkincraft-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        # We must populate this in the dashboard after the backend deploys.
        value: "https://malkincraft-backend.onrender.com/api"
